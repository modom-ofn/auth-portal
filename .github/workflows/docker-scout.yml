name: Docker Scout Scan

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ "build-and-publish" ]
    types: [ completed ]

permissions: {}

concurrency:
  group: docker-scout-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scout:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      IMAGE: modomofn/auth-portal
      SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      SCOUT_CLI: docker/scout-cli:1.20.4@sha256:28738a548abe9b4fd82b9de1ade84abacb09ee626d28c457c10866e6822bd564

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Docker Hub
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve published image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          tag="${SOURCE_SHA::7}"
          image_ref="$IMAGE:$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$image_ref" >> "$GITHUB_OUTPUT"
          docker pull "$image_ref"

      - name: Run Docker Scout CVE scan
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e DOCKER_HOST=unix:///var/run/docker.sock \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.docker":/root/.docker \
            "$SCOUT_CLI" cves "registry://$IMAGE_REF" --format markdown | tee scout.md

          {
            echo "## Docker Scout CVE scan"
            echo
            echo "Image: \`$IMAGE_REF\`"
            echo
            cat scout.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Docker Scout report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: docker-scout-${{ steps.image.outputs.tag }}
          path: scout.md
          if-no-files-found: error
          retention-days: 30

      - name: Extract critical count
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          crit=$(grep -oE 'alt="critical: [0-9]+"' scout.md | head -n 1 | grep -oE '[0-9]+' || true)
          if [[ -z "$crit" ]]; then
            echo "::error::Could not extract the critical vulnerability count from scout.md"
            exit 1
          fi
          echo "critical=$crit" >> "$GITHUB_OUTPUT"

      - name: Create badge
        run: |
          mkdir -p /tmp/badges
          echo "{\"schemaVersion\":1,\"label\":\"docker scout\",\"message\":\"critical: ${{ steps.parse.outputs.critical }}\",\"color\":\"red\"}" > /tmp/badges/docker-scout.json

      - name: Publish badge to badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin badges || true
          if git show-ref --verify --quiet refs/remotes/origin/badges; then
            git checkout badges
          else
            git checkout --orphan badges
            git rm -rf . || true
          fi
          mkdir -p .github/badges
          cp /tmp/badges/docker-scout.json .github/badges/docker-scout.json
          git add .github/badges/docker-scout.json
          git commit -m "chore: update Docker Scout badge" || echo "No changes to commit"
          git push origin HEAD:badges || echo "No changes to push"
